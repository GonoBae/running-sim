<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">실제 자료로 검증하는 순서</title><desc id="desc">검증 계획 · 보정 자료와 독립 평가 자료를 참가자 단위로 분리</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="600" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">실제 자료로 검증하는 순서</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">검증 계획 · 보정 자료와 독립 평가 자료를 참가자 단위로 분리</text><g><rect x="40" y="120" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="134" width="86" height="24" rx="12" fill="#fff0db"/><text x="99" y="151" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="175" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">원자료 확인</text><text x="175" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">출처·사용 조건·측정량</text></g><g><rect x="425" y="120" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="441" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="484" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">단위와 기준 정리</text><text x="560" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">좌표·관절·측정 / 추정 구분</text></g><g><rect x="810" y="120" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="826" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="869" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="945" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">참가자별 분리</text><text x="945" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">보정용 / 독립 평가용</text></g><path d="M 310 186 H 417" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 695 186 H 802" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="810" y="338" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="826" y="352" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="869" y="369" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="945" y="402" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">모델 보정</text><text x="945" y="429" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">보정용 자료만 사용</text></g><g><rect x="425" y="338" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="441" y="352" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="484" y="369" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="402" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">모델과 기준 고정</text><text x="560" y="429" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">지원 범위·오차 기준</text></g><g><rect x="40" y="338" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="352" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="369" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="175" y="402" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">독립 평가</text><text x="175" y="429" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">오차·한계·버전 보고서</text></g><path d="M 945 252 V 330" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 810 404 H 703" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 425 404 H 318" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 945 252 V 288 H 175 V 330" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400" y="279" font-size="15" fill="#63717d" text-anchor="middle" font-weight="500">독립 평가용 자료</text><rect x="40" y="512" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="542" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">각도 일치 · 접지 일관성 · 비용 정확도 · 완주 시간 정확도는 각각 별도 검사</text></g></svg>
