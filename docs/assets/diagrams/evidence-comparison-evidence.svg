<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f7f8f3"/><g font-family="Malgun Gothic, sans-serif"><text x="32" y="47" font-size="29" fill="#243c34" font-weight="400">무엇이 근거이고, 어디까지 비교할 수 있나요?</text><rect x="32" y="67" width="272" height="30" rx="15" fill="#edf3ed" stroke="#d9e1d9"/><text x="44" y="88" font-size="13" fill="#237864" font-weight="600">표시·상태 정책 · 설계 제안 / 미구현</text><rect x="32" y="124" width="356" height="180" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="52" y="161" font-size="24" fill="#bb6848" font-weight="600">사용자 설정</text><text x="52" y="201" font-size="17" fill="#718277" font-weight="400">입력한 각도·체형</text><text x="52" y="234" font-size="17" fill="#718277" font-weight="400">생성 방식·모델 버전</text><text x="52" y="267" font-size="17" fill="#718277" font-weight="400">사용자를 촬영한 실측값 아님</text><rect x="422" y="124" width="356" height="180" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="442" y="161" font-size="24" fill="#237864" font-weight="600">실측 유래 자료</text><text x="442" y="201" font-size="17" fill="#718277" font-weight="400">참가자·조건·주기 수·출처</text><text x="442" y="234" font-size="17" fill="#718277" font-weight="400">마커 좌표 / 계산 각도 구분</text><text x="442" y="267" font-size="17" fill="#718277" font-weight="400">한 표본을 권장값으로 삼지 않음</text><rect x="812" y="124" width="356" height="180" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="832" y="161" font-size="24" fill="#243c34" font-weight="600">계산 결과</text><text x="832" y="201" font-size="17" fill="#718277" font-weight="400">두 곡선의 차이·변경량</text><text x="832" y="234" font-size="17" fill="#718277" font-weight="400">정의·단위·대응 상태 표시</text><text x="832" y="267" font-size="17" fill="#718277" font-weight="400">기록 예측은 별도 검증 후</text><text x="32" y="352" font-size="23" fill="#243c34" font-weight="400">같은 기준으로 비교 가능한가?</text><rect x="32" y="376" width="552" height="123" rx="16" fill="#eaf2ea" stroke="#d9e1d9"/><text x="54" y="411" font-size="21" fill="#237864" font-weight="600">대응 확인</text><text x="54" y="446" font-size="18" fill="#243c34" font-weight="400">같은 부위·각도 정의·단위·진행률 기준</text><text x="54" y="478" font-size="16" fill="#718277" font-weight="400">차이 = 내 러너 − 자료  ·  + / − 부호 유지</text><rect x="608" y="376" width="560" height="123" rx="16" fill="#fbf1e9" stroke="#d9e1d9"/><text x="630" y="411" font-size="21" fill="#bb6848" font-weight="600">자료 부족 / 대응 전 / 조건 차이</text><text x="630" y="446" font-size="18" fill="#243c34" font-weight="400">누락은 —  ·  이유와 가능한 범위를 표시</text><text x="630" y="478" font-size="16" fill="#718277" font-weight="400">대응 전: 차이 숨김 / 조건 차이: 탐색 비교로 표시</text><rect x="32" y="523" width="1136" height="99" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="54" y="555" font-size="20" fill="#243c34" font-weight="400">기록 변화로 연결하려면 · 후속 검토</text><text x="54" y="587" font-size="18" fill="#718277" font-weight="400">자세 차이 → 별도 계산 모델·검증 → 지원 조건 안에서만 예상 기록 표시</text></g></svg>
