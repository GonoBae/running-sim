<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc"><title id="title">러닝 자세 입력 후보</title><desc id="desc">최종 항목·각도 기준·범위·기록 계산 지원은 검증 후 결정</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="580" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">러닝 자세 입력 후보</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">최종 항목·각도 기준·범위·기록 계산 지원은 검증 후 결정</text><g><rect x="40" y="124" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="138" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="155" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="188" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">상체 기울기</text><text x="190" y="215" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">몸통 기준선 ↔ 수직</text></g><g><rect x="410" y="124" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="138" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="469" y="155" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="188" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">다리 들기</text><text x="560" y="215" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">한 주기 최대 전방 각도</text></g><g><rect x="780" y="124" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="138" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="839" y="155" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="930" y="188" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">팔 흔들기</text><text x="930" y="215" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">어깨 기준 전후 운동 범위</text></g><path d="M 190 256 V 288 H 560 V 326" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 560 256 V 326" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 930 256 V 288 H 560" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="40" y="334" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="348" width="86" height="24" rx="12" fill="#fff0db"/><text x="99" y="365" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="190" y="398" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">목표값과 실제값</text><text x="190" y="425" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">생성한 동작에서 각도 측정</text></g><g><rect x="410" y="334" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="348" width="86" height="24" rx="12" fill="#fff0db"/><text x="469" y="365" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="560" y="398" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">달리기 한 주기</text><text x="560" y="425" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">무릎·발목·접지 연동</text></g><g><rect x="780" y="334" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="348" width="86" height="24" rx="12" fill="#fff0db"/><text x="839" y="365" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="930" y="398" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">기록 계산 지원 검사</text><text x="930" y="425" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">지원하지 않으면 비교 불가</text></g><path d="M 410 400 H 348" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 400 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="504" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="534" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">시각적으로 조절 가능 ≠ 기록 효과 계산 가능 · 원시 뼈 이름과 X/Y/Z는 최종 설정에서 제외</text></g></svg>
