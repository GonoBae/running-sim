<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">신체 세팅 → 자세 세팅 → 코스 세팅 → 백테스팅</title><desc id="desc">2026-10-21 사용자 확정 순서 · 각 단계의 구현 완료를 뜻하지 않습니다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="460" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">신체 세팅 → 자세 세팅 → 코스 세팅 → 백테스팅</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">2026-10-21 사용자 확정 순서 · 각 단계의 구현 완료를 뜻하지 않습니다</text><g><rect x="40" y="116" width="230" height="156" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="99" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="155" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">01  신체 세팅</text><text x="155" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">SCR02 · 기존 체형 설정</text><text x="155" y="230" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">모델 · 외형 · 부위 길이</text></g><g><rect x="310" y="116" width="230" height="156" rx="18" fill="white" stroke="#d9dfe5"/><rect x="326" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="369" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="425" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">02  자세 세팅</text><text x="425" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">SCR03 · 관절·수치 조절</text><text x="425" y="230" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">설정대로 달리기 미리보기</text></g><g><rect x="580" y="116" width="230" height="156" rx="18" fill="white" stroke="#d9dfe5"/><rect x="596" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="639" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="695" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">03  코스 세팅</text><text x="695" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">SCR04 · 트랙·출발·방향</text><text x="695" y="230" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">코스와 실행 조건 설정</text></g><g><rect x="850" y="116" width="230" height="156" rx="18" fill="white" stroke="#d9dfe5"/><rect x="866" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="909" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="965" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">04  백테스팅</text><text x="965" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">SCR05·06 · 주행·결과</text><text x="965" y="230" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">입력·계산 모델 검토 전</text></g><path d="M 270 194 H 302" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 540 194 H 572" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 810 194 H 842" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="560" y="317" font-size="17" fill="#63717d" text-anchor="middle" font-weight="500">M79: 변경 신체로 달리기 연결 / 코스·백테스팅은 준비 화면 / 실제 코스·계산 미구현</text><text x="560" y="352" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">단계 이동·새로고침 시 신체·자세 유지 / 직접 관절 재연결·물리 접지 검증 전</text><rect x="40" y="391" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="421" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">기준: R15 / R01–R08·R12 / D01–D04·D13 / 순서 확정과 계산 검증을 구분</text></g></svg>
