<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">서비스 이용 흐름</title><desc id="desc">기존 화면 순서 유지 · 캐릭터 내 동작 편집은 추가 검토</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="360" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">서비스 이용 흐름</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">기존 화면 순서 유지 · 캐릭터 내 동작 편집은 추가 검토</text><g><rect x="40" y="116" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="99" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="150" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">메인</text><text x="150" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">내 러너 만들기</text></g><g><rect x="310" y="116" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="326" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="369" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="420" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">캐릭터</text><text x="420" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">체형 + 자세 · 동작 편집 검토</text></g><g><rect x="580" y="116" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="596" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="639" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="690" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">코스</text><text x="690" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">실제 트랙 + 실행 조건</text></g><g><rect x="850" y="116" width="230" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="866" y="130" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="909" y="147" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="965" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">주행과 비교</text><text x="965" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">왼쪽 트랙 · 오른쪽 자세</text></g><path d="M 260 182 H 302" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 530 182 H 572" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 800 182 H 842" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="282" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="312" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">목표: 같은 능력·노력 조건에서 자세 A/B의 시뮬레이션 예상 기록 비교</text></g></svg>
