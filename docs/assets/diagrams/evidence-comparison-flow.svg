<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" fill="#f7f8f3"/><g font-family="Malgun Gothic, sans-serif"><text x="32" y="48" font-size="30" fill="#243c34" font-weight="400">자세를 만들고, 근거와 함께 확인하기</text><rect x="32" y="68" width="189" height="30" rx="15" fill="#edf3ed" stroke="#d9e1d9"/><text x="44" y="89" font-size="13" fill="#237864" font-weight="600">정식 기능 방향 · 확정</text><rect x="233" y="68" width="225" height="30" rx="15" fill="#edf3ed" stroke="#d9e1d9"/><text x="245" y="89" font-size="13" fill="#237864" font-weight="600">아래 상세 흐름 · 검토 제안</text><rect x="32" y="140" width="260" height="152" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="52" y="180" font-size="24" fill="#243c34" font-weight="400">체형 설정</text><text x="52" y="221" font-size="18" fill="#243c34" font-weight="400">내 러너 준비</text><text x="52" y="260" font-size="15" fill="#718277" font-weight="400">현재 길이·모델 유지</text><path d="M298 216L320 216" fill="none" stroke="#237864" stroke-width="2"/><path d="M312 211L320 216L312 221" fill="none" stroke="#237864" stroke-width="2"/><rect x="327" y="140" width="260" height="152" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="347" y="180" font-size="24" fill="#243c34" font-weight="400">자세 설정</text><text x="347" y="221" font-size="18" fill="#243c34" font-weight="400">자세 조절 · 재생</text><text x="347" y="260" font-size="15" fill="#718277" font-weight="400">기존 SCR03 흐름</text><path d="M593 216L615 216" fill="none" stroke="#237864" stroke-width="2"/><path d="M607 211L615 216L607 221" fill="none" stroke="#237864" stroke-width="2"/><rect x="622" y="140" width="260" height="152" rx="16" fill="#eaf2ea" stroke="#d9e1d9"/><text x="642" y="180" font-size="24" fill="#243c34" font-weight="400">근거 비교</text><text x="642" y="221" font-size="18" fill="#243c34" font-weight="400">내 설정 ↔ 선택한 자료</text><text x="642" y="260" font-size="15" fill="#718277" font-weight="400">SCR08 보조 화면 제안</text><path d="M888 216L910 216" fill="none" stroke="#237864" stroke-width="2"/><path d="M902 211L910 216L902 221" fill="none" stroke="#237864" stroke-width="2"/><rect x="917" y="140" width="260" height="152" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="937" y="180" font-size="24" fill="#243c34" font-weight="400">코스 설정</text><text x="937" y="221" font-size="18" fill="#243c34" font-weight="400">확인 후 계속하기</text><text x="937" y="260" font-size="15" fill="#718277" font-weight="400">기존 순서 유지</text><path d="M752 305V337H457V305" fill="none" stroke="#237864" stroke-width="2"/><text x="505" y="365" font-size="17" fill="#237864" font-weight="400">비교 후 자세로 돌아가 수정</text><rect x="32" y="394" width="1136" height="87" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="54" y="425" font-size="18" fill="#237864" font-weight="600">현재 검증 완료 · M13</text><text x="54" y="454" font-size="18" fill="#718277" font-weight="400">기본 남성형 + 실측 유래 왼다리 두 각도 대응 / 내 설정 연결·전신 비교는 미구현</text></g></svg>
