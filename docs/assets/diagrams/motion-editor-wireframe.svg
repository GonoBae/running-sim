<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">동작 편집 화면 · 검토용 배치</title><desc id="desc">미구현 와이어프레임 · 수치와 4개 프레임은 예시이며 확정 사양이 아님</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect width="1120" height="800" rx="22" fill="#f6f7f2"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">동작 편집 화면 · 검토용 배치</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">미구현 와이어프레임 · 수치와 4개 프레임은 예시이며 확정 사양이 아님</text><rect x="40" y="110" width="1040" height="52" rx="10" fill="#e8eee6"/><text x="65" y="143" text-anchor="start" font-size="21" fill="#283b35">동작 편집</text><text x="1055" y="143" text-anchor="end" font-size="15" fill="#67756e">전신  /  측면  /  정면</text><rect x="40" y="178" width="655" height="356" rx="16" fill="#fff" stroke="#d6ded6"/><g transform="translate(355 380) scale(1.05)" stroke="#506b58" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cy="-125" r="19" fill="#dce5d6"/><path d="M0 -105L3 -20 M0 -85L-47 -48L-65 -68 M0 -85L48 -58L62 -86 M3 -20L-35 42L-58 91 M3 -20L42 26L35 94"/></g><text x="64" y="207" text-anchor="start" font-size="16" fill="#67756e">캐릭터 전체 동작</text><g><rect x="715" y="178" width="365" height="225" rx="15" fill="#fff" stroke="#d6ded6"/><text x="735" y="205" text-anchor="start" font-size="13" fill="#996334">입력 예시 · 기능 미구현</text><text x="897.5" y="240" text-anchor="middle" font-size="21" fill="#283b35">선택한 프레임의 자세</text><text x="897.5" y="270" text-anchor="middle" font-size="16" fill="#67756e">어깨 앞뒤        15°</text><text x="897.5" y="293" text-anchor="middle" font-size="16" fill="#67756e">팔꿈치 굽힘      80°</text><text x="897.5" y="316" text-anchor="middle" font-size="16" fill="#67756e">다리 앞뒤        30°</text><text x="897.5" y="339" text-anchor="middle" font-size="16" fill="#67756e">무릎 굽힘        65°</text></g><rect x="715" y="420" width="365" height="114" rx="16" fill="#e8eee6"/><text x="897" y="455" text-anchor="middle" font-size="17" fill="#283b35">[현재 자세 저장]  [원래 값으로]</text><text x="897" y="491" text-anchor="middle" font-size="15" fill="#67756e">재생 중에는 편집 잠금 제안</text><rect x="40" y="554" width="1040" height="165" rx="16" fill="#fff" stroke="#d6ded6"/><text x="65" y="583" text-anchor="start" font-size="17" fill="#283b35">타임라인  ·  재생 / 정지  ·  현재 시점  ·  한 주기 길이</text><rect x="70" y="603" width="210" height="80" rx="10" fill="#f4f5f1" stroke="#d6ded6"/><text x="175" y="635" text-anchor="middle" font-size="18" fill="#283b35">자세 1</text><text x="175" y="662" text-anchor="middle" font-size="15" fill="#67756e">0.00초</text><rect x="315" y="603" width="210" height="80" rx="10" fill="#e0eadb" stroke="#607d55"/><text x="420" y="635" text-anchor="middle" font-size="18" fill="#283b35">자세 2</text><text x="420" y="662" text-anchor="middle" font-size="15" fill="#67756e">0.25초</text><rect x="560" y="603" width="210" height="80" rx="10" fill="#f4f5f1" stroke="#d6ded6"/><text x="665" y="635" text-anchor="middle" font-size="18" fill="#283b35">자세 3</text><text x="665" y="662" text-anchor="middle" font-size="15" fill="#67756e">0.50초</text><rect x="805" y="603" width="210" height="80" rx="10" fill="#f4f5f1" stroke="#d6ded6"/><text x="910" y="635" text-anchor="middle" font-size="18" fill="#283b35">자세 4</text><text x="910" y="662" text-anchor="middle" font-size="15" fill="#67756e">0.75초</text><rect x="40" y="739" width="1040" height="46" rx="12" fill="#e8eee6"/><text x="560" y="768" text-anchor="middle" font-size="16" fill="#283b35">프레임 데이터 저장 ≠ 조작 과정 녹화 ≠ 재생 영상 파일 저장</text></g></svg>