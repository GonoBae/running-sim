<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575"><rect width="1200" height="575" rx="20" fill="#f4f6f1"/><g font-family="Malgun Gothic, sans-serif"><text x="32" y="48" font-size="29" fill="#263c31">검토안 · 근거가 있는 기본 동작 → 사용자 설정</text><text x="32" y="79" font-size="17" fill="#617568">M13: 왼다리 두 각도 대응만 구현 / 전신·접지·설정 연결은 검토안</text><rect x="32" y="115" width="355" height="150" rx="16" fill="white" stroke="#d8e1d9"/><text x="52" y="155" font-size="23" fill="#263c31">1  자료와 조건</text><text x="52" y="196" font-size="18" fill="#263c31">참가자·속도·한 주기</text><text x="52" y="231" font-size="17" fill="#617568">실측 좌표 / 계산 각도 구분</text><path d="M392 190h32l-8-6m8 6-8 6" stroke="#718779" stroke-width="2" fill="none"/><rect x="422" y="115" width="355" height="150" rx="16" fill="white" stroke="#d8e1d9"/><text x="442" y="155" font-size="23" fill="#263c31">2  뼈대 대응</text><text x="442" y="196" font-size="18" fill="#263c31">골반·허벅지·무릎·발</text><text x="442" y="231" font-size="17" fill="#617568">기준축·중립 자세 변환</text><path d="M782 190h32l-8-6m8 6-8 6" stroke="#718779" stroke-width="2" fill="none"/><rect x="812" y="115" width="355" height="150" rx="16" fill="white" stroke="#d8e1d9"/><text x="832" y="155" font-size="23" fill="#263c31">3  기본 주기</text><text x="832" y="196" font-size="18" fill="#263c31">같은 쪽 착지 → 다음 착지</text><text x="832" y="231" font-size="17" fill="#617568">반복 경계·좌우 위상 검사</text><rect x="32" y="310" width="355" height="150" rx="16" fill="white" stroke="#d8e1d9"/><text x="52" y="350" font-size="23" fill="#263c31">4  발과 지면</text><text x="52" y="391" font-size="18" fill="#263c31">착지·지지·떼기 구분</text><text x="52" y="426" font-size="17" fill="#617568">발 미끄러짐 / 골반 보정</text><path d="M392 385h32l-8-6m8 6-8 6" stroke="#718779" stroke-width="2" fill="none"/><rect x="422" y="310" width="355" height="150" rx="16" fill="white" stroke="#d8e1d9"/><text x="442" y="350" font-size="23" fill="#263c31">5  사용자 설정</text><text x="442" y="391" font-size="18" fill="#263c31">다리 올림·팔·착지 형태</text><text x="442" y="426" font-size="17" fill="#617568">설정 후 궤적을 다시 계산</text><path d="M782 385h32l-8-6m8 6-8 6" stroke="#718779" stroke-width="2" fill="none"/><rect x="812" y="310" width="355" height="150" rx="16" fill="white" stroke="#d8e1d9"/><text x="832" y="350" font-size="23" fill="#263c31">6  시각·수치 확인</text><text x="832" y="391" font-size="18" fill="#263c31">정면 / 측면 / 느린 재생</text><text x="832" y="426" font-size="17" fill="#617568">자료 대조 + 기존 기능 회귀</text><text x="32" y="505" font-size="20" fill="#263c31">M13 첫 실험: 별도 화면에서 왼다리 두 각도 대응 검사 완료 → 사용자 검토</text><text x="32" y="540" font-size="17" fill="#617568">착지 유형·팔·몸통·다른 체형·기록 예측은 각각 후속 범위로 검토합니다.</text></g></svg>