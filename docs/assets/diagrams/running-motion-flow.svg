<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#598673"/></marker></defs><rect width="1120" height="440" fill="#f5f7f3"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="30" fill="#203c34">주요 자세 잡기 → 달리기 재생 → 보고 수정</text><text x="36" y="80" font-size="17" fill="#203c34">합의한 사용자 흐름 · M06 다리 올림 반복 확인 · 완성 달리기/접지 미구현</text><rect x="36" y="120" width="310" height="170" rx="18" fill="#ffffff" stroke="#ccd9d2"/><text x="60" y="156" font-size="23" fill="#203c34">01  사용자가 자세 조절</text><text x="60" y="199" font-size="20" fill="#203c34">다리 올림 · 회수 · 착지</text><text x="60" y="235" font-size="17" fill="#203c34">팔 · 상체 등 러닝에 필요한 입력</text><path d="M355 203 L391 203" stroke="#598673" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="405" y="120" width="310" height="170" rx="18" fill="#ffffff" stroke="#ccd9d2"/><text x="429" y="156" font-size="23" fill="#203c34">02  시스템이 동작 생성</text><text x="429" y="199" font-size="20" fill="#203c34">설정한 자세를 달리기에 반영</text><text x="429" y="235" font-size="17" fill="#203c34">사이 동작 · 좌우 교대 · 반복</text><path d="M724 203 L760 203" stroke="#598673" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="774" y="120" width="310" height="170" rx="18" fill="#ffffff" stroke="#ccd9d2"/><text x="798" y="156" font-size="23" fill="#203c34">03  재생하며 확인</text><text x="798" y="199" font-size="20" fill="#203c34">원하는 움직임인지 보기</text><text x="798" y="235" font-size="17" fill="#203c34">멈춤 → 자세 수정 → 다시 재생</text><path d="M930 303 V332 H190 V303" fill="none" stroke="#598673" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="364" font-size="18" fill="#203c34">수정한 설정으로 다시 생성</text><text x="36" y="411" font-size="17" fill="#203c34">M01 저장·복원 + M06 다리 올림: 로컬 확인  /  완성 달리기·접지: 별도 검증 필요</text></g></svg>
