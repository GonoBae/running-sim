<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1135" height="470" viewBox="0 0 1135 470"><rect width="1135" height="470" fill="#f7f8f5"/><g font-family="Malgun Gothic, sans-serif"><text x="28" y="42" font-size="27" fill="#294632" font-weight="600">실제 경로 자료 → 검증된 한 바퀴 → 코스 화면</text><text x="28" y="76" font-size="17" fill="#7b887a" font-weight="400">위치 자료 확보와 러닝 코스 확정은 서로 다른 단계입니다.</text><rect x="28" y="112" width="247" height="204" rx="14" fill="white" stroke="#dce2d8"/><rect x="43" y="127" width="120" height="30" rx="15" fill="#e3edd9" stroke="none"/><text x="55" y="148" font-size="14" fill="#294632" font-weight="600">확인 완료</text><text x="43" y="189" font-size="22" fill="#294632" font-weight="600">좌표 자료 확보</text><text x="43" y="228" font-size="17" fill="#294632" font-weight="400">OSM 보행 선형</text><text x="43" y="270" font-size="15" fill="#7b887a" font-weight="400">원본 ID · 버전 · 출처</text><text x="282" y="228" font-size="20" fill="#7b887a" font-weight="400">→</text><rect x="305" y="112" width="247" height="204" rx="14" fill="white" stroke="#dce2d8"/><rect x="320" y="127" width="120" height="30" rx="15" fill="#f8edda" stroke="none"/><text x="332" y="148" font-size="14" fill="#996526" font-weight="600">검토 필요</text><text x="320" y="189" font-size="22" fill="#294632" font-weight="600">한 바퀴 확정</text><text x="320" y="228" font-size="17" fill="#294632" font-weight="400">현장 / GPS와 대조</text><text x="320" y="270" font-size="15" fill="#7b887a" font-weight="400">경로 순서 · 닫힘 · 출발</text><text x="559" y="228" font-size="20" fill="#7b887a" font-weight="400">→</text><rect x="582" y="112" width="247" height="204" rx="14" fill="white" stroke="#dce2d8"/><rect x="597" y="127" width="120" height="30" rx="15" fill="#f8edda" stroke="none"/><text x="609" y="148" font-size="14" fill="#996526" font-weight="600">미구현</text><text x="597" y="189" font-size="22" fill="#294632" font-weight="600">거리 검증</text><text x="597" y="228" font-size="17" fill="#294632" font-weight="400">미터 변환 · 누적 거리</text><text x="597" y="270" font-size="15" fill="#7b887a" font-weight="400">원본 길이와 변환 오차</text><text x="836" y="228" font-size="20" fill="#7b887a" font-weight="400">→</text><rect x="859" y="112" width="247" height="204" rx="14" fill="white" stroke="#dce2d8"/><rect x="874" y="127" width="120" height="30" rx="15" fill="#f8edda" stroke="none"/><text x="886" y="148" font-size="14" fill="#996526" font-weight="600">미구현</text><text x="874" y="189" font-size="22" fill="#294632" font-weight="600">화면 연결</text><text x="874" y="228" font-size="17" fill="#294632" font-weight="400">고정 코스 1개</text><text x="874" y="270" font-size="15" fill="#7b887a" font-weight="400">출발 · 방향 · 바퀴</text><rect x="28" y="344" width="1078" height="100" rx="12" fill="#f8edda" stroke="none"/><text x="47" y="375" font-size="18" fill="#996526" font-weight="600">OSM 선형이 실제 트랙과 다르면: 현장 GPS 한 바퀴 → GPX → 같은 검증 단계</text><text x="47" y="405" font-size="16" fill="#996526" font-weight="400">NRC는 지역에서 지원되는 Strava 연동 후 GPX 내보내기 경로를 검토할 수 있습니다.</text><text x="47" y="430" font-size="15" fill="#996526" font-weight="400">현재 계정·기존 기록의 좌표 포함 여부는 미확인입니다. 자동 계정 연동은 구현 범위 밖입니다.</text></g></svg>