nt-size="16" fill="#67756e">모델 · 설정 · 8개 값 확인</text><text x="930" y="238" text-anchor="middle" font-size="16" fill="#67756e">일부 값만 적용하지 않음</text></g><path d="M340 190L400 190" fill="none" stroke="#90a297" stroke-width="2.5" marker-end="url(#a)"/><path d="M710 190L770 190" fill="none" stroke="#90a297" stroke-width="2.5" marker-end="url(#a)"/><g><rect x="780" y="330" width="300" height="148" rx="14" fill="#fff" stroke="#d6ded6"/><text x="800" y="358" text-anchor="start" font-size="13" fill="#387148">로컬 동작 확인</text><text x="930" y="396" text-anchor="middle" font-size="22" fill="#283b35">각도 A 복원</text><text x="930" y="428" text-anchor="middle" font-size="16" fill="#67756e">검사를 통과하면 한 번에 적용</text><text x="930" y="452" text-anchor="middle" font-size="16" fill="#67756e">현재 체형 · 카메라 유지</text></g><g><rect x="410" y="330" width="300" height="148" rx="14" fill="#fff" stroke="#d6ded6"/><text x="430" y="358" text-anchor="start" font-size="13" fill="#387148">로컬 동작 확인</text><text x="560" y="396" text-anchor="middle" font-size="22" fill="#283b35">검사 실패</text><text x="560" y="428" text-anchor="middle" font-size="16" fill="#67756e">현재 자세 · 저장본 유지</text><text x="560" y="452" text-anchor="middle" font-size="16" fill="#67756e">불러올 수 없는 이유 표시</text></g><g><rect x="40" y="330" width="300" height="148" rx="14" fill="#fff" stroke="#d6ded6"/><text x="60" y="358" text-anchor="start" font-size="13" fill="#387148">로컬 동작 확인</text><text x="190" y="396" text-anchor="middle" font-size="22" fill="#283b35">새로고침 · 페이지 종료</text><text x="190" y="428" text-anchor="middle" font-size="16" fill="#67756e">임시 저장본 사라짐</text><text x="190" y="452" text-anchor="middle" font-size="16" fill="#67756e">영구 보관은 후속 검토</text></g><path d="M1000 264L1000 318" fill="none" stroke="#90a297" stroke-width="2.5" marker-end="url(#a)"/><text x="1035" y="300" text-anchor="middle" font-size="14" fill="#67756e">통과</text><path d="M850 264V292H560V318" fill="none" stroke="#90a297" stroke-width="2.5" marker-end="url(#a)"/><text x="700" 