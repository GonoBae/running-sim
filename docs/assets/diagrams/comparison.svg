<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">자세를 바꾸면 무엇을 비교하나요</title><desc id="desc">실행 방식의 설계안 · 비용·능력·노력 모델은 아직 미선정</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="530" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">자세를 바꾸면 무엇을 비교하나요</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">실행 방식의 설계안 · 비용·능력·노력 모델은 아직 미선정</text><g><rect x="40" y="116" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="130" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="147" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">고정 페이스</text><text x="190" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">거리 + 페이스 고정</text></g><g><rect x="410" y="116" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="130" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="469" y="147" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">동작 관찰</text><text x="560" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">자세 A / 자세 B</text></g><g><rect x="780" y="116" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="130" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="839" y="147" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="930" y="180" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">같은 소요 시간</text><text x="930" y="207" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">시간 = 거리 ÷ 속도</text></g><path d="M 340 182 H 402" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 182 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="40" y="300" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="314" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="331" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="364" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">같은 노력 조건</text><text x="190" y="391" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">체형·능력·코스·거리 고정</text></g><g><rect x="410" y="300" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="314" width="86" height="24" rx="12" fill="#fff0db"/><text x="469" y="331" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="560" y="364" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">자세 A / 자세 B</text><text x="560" y="391" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">동작 + 비용 계산</text></g><g><rect x="780" y="300" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="314" width="86" height="24" rx="12" fill="#fff0db"/><text x="839" y="331" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="930" y="364" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">예상 기록 비교</text><text x="930" y="391" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">속도·시간 산출 → B − A</text></g><path d="M 340 366 H 402" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 366 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="460" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="490" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">표시: 시뮬레이션 예상 기록 / 미지원 이유 · 자세 추천과 교정 점수는 제외</text></g></svg>
