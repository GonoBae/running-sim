<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="530" viewBox="0 0 1160 530">
<rect width="1160" height="530" fill="#f6f5f1"/>
<g font-family="Malgun Gothic, sans-serif" fill="#253b32">
<text x="36" y="49" font-size="27" font-weight="700">기본 달리기 · 부분 수치보다 전신 동작부터</text>
<text x="36" y="80" font-size="15">2026-10-15 / 현재 결과: 사용자 품질 검토 미통과 / 다음 구조: 검토안 · 구현 전</text>
<rect x="36" y="112" width="524" height="230" rx="18" fill="#f1e4dd"/>
<rect x="584" y="112" width="540" height="230" rx="18" fill="#e1ece5"/>
<text x="60" y="151" font-size="21" font-weight="700">현재 · 서로 다른 근거를 조합</text>
<text x="60" y="192" font-size="18">허벅지·무릎  ←  한쪽 다리 평균 각도</text>
<text x="60" y="228" font-size="18">발·팔·몸통  ←  직접 작성한 움직임</text>
<text x="60" y="264" font-size="18">골반·접지  ←  추가 위치·높이 보정</text>
<text x="60" y="312" font-size="17" fill="#984b32">부분 검사 통과 ≠ 자연스러운 전신 달리기</text>
<text x="608" y="151" font-size="21" font-weight="700">검토안 · 같은 한 주기를 함께 재현</text>
<text x="608" y="192" font-size="18">1. 실제 전신 달리기 기준 동작 확인</text>
<text x="608" y="228" font-size="18">2. 양발·골반·몸통·팔의 시점을 함께 대응</text>
<text x="608" y="264" font-size="18">3. 측면·정면 반복 재생으로 사용자 검토</text>
<text x="608" y="312" font-size="17" fill="#277458">기본 동작을 확인한 뒤 사용자 설정 연결</text>
<rect x="36" y="366" width="1088" height="126" rx="18" fill="#fff"/>
<text x="60" y="402" font-size="20" font-weight="700">다음 작은 작업의 완료 기준</text>
<text x="60" y="437" font-size="18">기준 동작과 모델을 같은 속도로 나란히 재생 → 달리는 느낌을 먼저 확인</text>
<text x="60" y="469" font-size="15" fill="#657168">자료·라이선스·뼈대 대응은 확인 필요 / 완성 클립 단순 재생으로 사용자 자세 설정 목표를 대체하지 않음</text>
</g></svg>
