<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="465" viewBox="0 0 1120 465" role="img" aria-labelledby="title desc"><title id="title">요구 → 화면 → 설계 → 검증</title><desc id="desc">R01–R14 ID 유지 · 최신 기준은 요구사항 명세서 한 곳에서 관리</desc><rect width="1120" height="465" rx="22" fill="#f5f7f1"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="40" y="48" font-size="28" fill="#304337" text-anchor="start">요구 → 화면 → 설계 → 검증</text><text x="40" y="80" font-size="16" fill="#6b786e" text-anchor="start">R01–R14 ID 유지 · 최신 기준은 요구사항 명세서 한 곳에서 관리</text><g><rect x="40" y="120" width="230" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="155" y="156" font-size="22" fill="#304337" text-anchor="middle">요구사항</text><text x="155" y="192" font-size="16" fill="#6b786e" text-anchor="middle">무엇이 되어야 하나</text><text x="155" y="218" font-size="16" fill="#6b786e" text-anchor="middle">R01–R14</text></g><g><rect x="310" y="120" width="230" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="425" y="156" font-size="22" fill="#304337" text-anchor="middle">화면 정의</text><text x="425" y="192" font-size="16" fill="#6b786e" text-anchor="middle">어디서 조작하나</text><text x="425" y="218" font-size="16" fill="#6b786e" text-anchor="middle">SCR01–SCR07</text></g><g><rect x="580" y="120" width="230" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="695" y="156" font-size="22" fill="#304337" text-anchor="middle">기술·데이터</text><text x="695" y="192" font-size="16" fill="#6b786e" text-anchor="middle">어떻게 연결하나</text><text x="695" y="218" font-size="16" fill="#6b786e" text-anchor="middle">구현 / 제안 구분</text></g><g><rect x="850" y="120" width="230" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="965" y="156" font-size="22" fill="#304337" text-anchor="middle">검증 증거</text><text x="965" y="192" font-size="16" fill="#6b786e" text-anchor="middle">무엇으로 확인하나</text><text x="965" y="218" font-size="16" fill="#6b786e" text-anchor="middle">수치·화면·남은 한계</text></g><text x="290" y="193" font-size="26" fill="#304337" text-anchor="middle">→</text><text x="560" y="193" font-size="26" fill="#304337" text-anchor="middle">→</text><text x="830" y="193" font-size="26" fill="#304337" text-anchor="middle">→</text><rect x="40" y="290" width="1040" height="122" rx="16" fill="#e6eee1"/><text x="560" y="328" font-size="20" fill="#304337" text-anchor="middle">일부 로컬 확인: 체형 길이 · 제한 자세 · 모델 선택 · 관리자 시험</text><text x="560" y="362" font-size="18" fill="#304337" text-anchor="middle">미구현: 프레임 편집 · 실제 코스 주행 · 기록 계산 · 운영 인증/통계</text><text x="560" y="391" font-size="16" fill="#6b786e" text-anchor="middle">미정 사양은 검토 항목으로 남기고, 구현 완료로 표시하지 않습니다.</text></g></svg>