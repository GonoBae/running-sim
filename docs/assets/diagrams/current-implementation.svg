<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="현재 구현 · 신체에서 실제 코스 주행까지"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#6c8179"/></marker></defs><rect width="1200" height="740" fill="#fafbf8"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="58" font-size="32" fill="#203a32" font-weight="700">현재 구현 · 신체에서 실제 코스 주행까지</text><text x="40" y="95" font-size="18" fill="#63786e" font-weight="400">2026-10-26 문서 대조 · M93까지의 로컬 기능 · 확정 요구 R01–R16과 별도 표시</text><g><rect x="40" y="135" width="535" height="180" rx="18" fill="#e7f0e8"/><text x="64" y="173" font-size="24" fill="#233b35" font-weight="700">01  신체 세팅  /body</text><text x="64" y="213" font-size="18" fill="#233b35" font-weight="400">남성형·여성형 / 몸 위에서 길이·크기 조절</text><text x="64" y="243" font-size="18" fill="#233b35" font-weight="400">외형과 뼈대 함께 변경 → 달리기에 전달</text><text x="64" y="273" font-size="18" fill="#233b35" font-weight="400">구현·기능 검사: M79–M80</text></g><g><rect x="625" y="135" width="535" height="180" rx="18" fill="#e7f0e8"/><text x="649" y="173" font-size="24" fill="#233b35" font-weight="700">02  자세 세팅  /pose</text><text x="649" y="213" font-size="18" fill="#233b35" font-weight="400">다리·아래팔·몸통을 잡아 양쪽 공통 설정</text><text x="649" y="243" font-size="18" fill="#233b35" font-weight="400">착지 선택 / 기본 달리기 재생·정지·앞·옆</text><text x="649" y="273" font-size="18" fill="#233b35" font-weight="400">구현·기능 검사: M75–M84</text></g><path d="M582 225 L618 225" fill="none" stroke="#6c8179" stroke-width="3" marker-end="url(#a)"/><path d="M890 319 V335 H307 V350" fill="none" stroke="#6c8179" stroke-width="3" marker-end="url(#a)"/><g><rect x="40" y="355" width="535" height="180" rx="18" fill="#e7f0e8"/><text x="64" y="393" font-size="24" fill="#233b35" font-weight="700">03  코스 세팅  /course</text><text x="64" y="433" font-size="18" fill="#233b35" font-weight="400">출발점·방향 / 바퀴 또는 km / 목표 페이스</text><text x="64" y="463" font-size="18" fill="#233b35" font-weight="400">지도 도착점 / 항공사진 수정 전후 비교</text><text x="64" y="493" font-size="18" fill="#233b35" font-weight="400">구현·기능 검사: M87–M93</text></g><g><rect x="625" y="355" width="535" height="180" rx="18" fill="#e7f0e8"/><text x="649" y="393" font-size="24" fill="#233b35" font-weight="700">04  백테스팅 단계  /backtest</text><text x="649" y="433" font-size="18" fill="#233b35" font-weight="400">현재 화면 이름: 코스 주행</text><text x="649" y="463" font-size="18" fill="#233b35" font-weight="400">왼쪽 경로 이동 + 오른쪽 같은 순간 자세</text><text x="649" y="493" font-size="18" fill="#233b35" font-weight="400">구현: 주행·종료 / 미구현: 자세별 기록 예측</text></g><path d="M582 445 L618 445" fill="none" stroke="#6c8179" stroke-width="3" marker-end="url(#a)"/><text x="40" y="583" font-size="20" fill="#233b35" font-weight="700">설정 유지</text><text x="185" y="583" font-size="19" fill="#233b35" font-weight="400">같은 탭의 단계 이동·새로고침: sessionStorage / 재생 시간은 다시 시작</text><g><rect x="40" y="610" width="1120" height="110" rx="18" fill="#f5e8d9"/><text x="64" y="648" font-size="24" fill="#233b35" font-weight="700">미완료</text><text x="64" y="688" font-size="18" fill="#233b35" font-weight="400">현장 도착점 전체 일치 / 기록 A·B / 근거 비교 정식 화면 / 운영 관리자·통계</text></g></g></svg>