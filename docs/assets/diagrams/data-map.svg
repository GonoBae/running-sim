<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">무엇을 저장하고 연결하나요</title><desc id="desc">데이터 설계 초안 · 표시는 모델 외형, 자세는 관절값, 동작은 시간에 따른 자세</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect width="1120" height="560" rx="22" fill="#f6f7f2"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">무엇을 저장하고 연결하나요</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">데이터 설계 초안 · 표시는 모델 외형, 자세는 관절값, 동작은 시간에 따른 자세</text><g><rect x="40" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="190" y="182" text-anchor="middle" font-size="21" fill="#283b35">모델·체형</text><text x="190" y="212" text-anchor="middle" font-size="16" fill="#67756e">자산 해시 + 체형/길이 값</text><text x="190" y="235" text-anchor="middle" font-size="16" fill="#67756e">변형 방식·관절 대응 버전</text></g><g><rect x="410" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="560" y="182" text-anchor="middle" font-size="21" fill="#283b35">프레임 묶음</text><text x="560" y="212" text-anchor="middle" font-size="16" fill="#67756e">프레임 ID + 시각 + 관절값</text><text x="560" y="235" text-anchor="middle" font-size="16" fill="#67756e">주기·연결 방식·편집 버전</text></g><g><rect x="780" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="930" y="182" text-anchor="middle" font-size="21" fill="#283b35">실행 조건</text><text x="930" y="212" text-anchor="middle" font-size="16" fill="#67756e">체형 + 동작의 확정 복사본</text><text x="930" y="235" text-anchor="middle" font-size="16" fill="#67756e">코스·방향·거리·실행 방식</text></g><path d="M340 190 L400 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M710 190 L770 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><g><rect x="780" y="320" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="347" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="930" y="382" text-anchor="middle" font-size="21" fill="#283b35">실행 결과</text><text x="930" y="412" text-anchor="middle" font-size="16" fill="#67756e">상태·거리·시간·동작 참조</text><text x="930" y="435" text-anchor="middle" font-size="16" fill="#67756e">공통 시각으로 두 화면 재생</text></g><g><rect x="410" y="320" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="347" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="560" y="382" text-anchor="middle" font-size="21" fill="#283b35">비교 A / B</text><text x="560" y="412" text-anchor="middle" font-size="16" fill="#67756e">기준 A 보관 · 자세만 변경</text><text x="560" y="435" text-anchor="middle" font-size="16" fill="#67756e">조건 불일치 → 비교 차단</text></g><g><rect x="40" y="320" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="347" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="190" y="382" text-anchor="middle" font-size="21" fill="#283b35">관리자 사용 통계</text><text x="190" y="412" text-anchor="middle" font-size="16" fill="#67756e">확정 버튼 기준 사용 기록</text><text x="190" y="435" text-anchor="middle" font-size="16" fill="#67756e">시험·단순 편집 제외</text></g><path d="M930 265 L930 310" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M780 390 L720 390" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="495" width="1040" height="46" rx="12" fill="#e8eee6"/><text x="560" y="524" text-anchor="middle" font-size="16" fill="#283b35">현재 프레임 저장은 미구현 · 영구 저장과 운영 이벤트 정의는 별도 검토</text></g></svg>