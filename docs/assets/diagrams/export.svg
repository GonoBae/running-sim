<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Blender에서 웹까지</title><desc id="desc">현재 모델 기준 · 원본 .blend는 보관하고 복사본을 GLB로 출력</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="380" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">Blender에서 웹까지</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">현재 모델 기준 · 원본 .blend는 보관하고 복사본을 GLB로 출력</text><g><rect x="40" y="126" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="140" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="99" y="157" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">시험 확인</text><text x="150" y="190" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">저장한 .blend</text><text x="150" y="217" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">몸체 + 뼈대</text></g><g><rect x="310" y="126" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="326" y="140" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="369" y="157" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">시험 확인</text><text x="420" y="190" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">보조 형상 정리</text><text x="420" y="217" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">원본과 출력 분리</text></g><g><rect x="580" y="126" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="596" y="140" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="639" y="157" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">시험 확인</text><text x="690" y="190" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">GLB 내보내기</text><text x="690" y="217" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">Shape Keys + Skinning</text></g><g><rect x="850" y="126" width="230" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="866" y="140" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="909" y="157" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">시험 확인</text><text x="965" y="190" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">웹에서 확인</text><text x="965" y="217" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">GLB 열기 → 조절 → 복원</text></g><path d="M 260 192 H 302" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 530 192 H 572" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 800 192 H 842" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="294" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="324" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">초기 원본 시험: 53개 뼈 · 12개 변형키 / 최신 길이·자세 검사는 검증 문서 참고</text></g></svg>
