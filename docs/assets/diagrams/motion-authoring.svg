<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc"><title id="title">사용자가 만드는 달리기 동작</title><desc id="desc">검토 제안 · 핵심 자세를 저장하고 연결 · 실제 달리기 자세 측정 기능은 아님</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect width="1120" height="540" rx="22" fill="#f6f7f2"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">사용자가 만드는 달리기 동작</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">검토 제안 · 핵심 자세를 저장하고 연결 · 실제 달리기 자세 측정 기능은 아님</text><g><rect x="40" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="147" text-anchor="start" font-size="13" fill="#387148">일부 구현 완료</text><text x="190" y="182" text-anchor="middle" font-size="21" fill="#283b35">자세 조절</text><text x="190" y="212" text-anchor="middle" font-size="16" fill="#67756e">어깨 · 팔꿈치 · 고관절 · 무릎</text></g><g><rect x="410" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="560" y="182" text-anchor="middle" font-size="21" fill="#283b35">프레임 저장</text><text x="560" y="212" text-anchor="middle" font-size="16" fill="#67756e">시간 + 관절값의 복사본</text></g><g><rect x="780" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="930" y="182" text-anchor="middle" font-size="21" fill="#283b35">타임라인 편집</text><text x="930" y="212" text-anchor="middle" font-size="16" fill="#67756e">추가 · 복사 · 삭제 · 시간</text></g><path d="M340 190 L400 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M710 190 L770 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><g><rect x="780" y="310" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="337" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="930" y="372" text-anchor="middle" font-size="21" fill="#283b35">중간 동작 연결</text><text x="930" y="402" text-anchor="middle" font-size="16" fill="#67756e">각도 제한 · 주기 경계 검사</text></g><g><rect x="410" y="310" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="337" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="560" y="372" text-anchor="middle" font-size="21" fill="#283b35">반복 재생·수정</text><text x="560" y="402" text-anchor="middle" font-size="16" fill="#67756e">전신 보기 · 프레임 탐색</text></g><g><rect x="40" y="310" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="337" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="190" y="372" text-anchor="middle" font-size="21" fill="#283b35">동작 확정</text><text x="190" y="402" text-anchor="middle" font-size="16" fill="#67756e">코스 재생용 버전 보관</text></g><path d="M930 263 L930 300" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M780 380 L720 380" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M410 380 L350 380" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="480" width="1040" height="46" rx="12" fill="#e8eee6"/><text x="560" y="509" text-anchor="middle" font-size="16" fill="#283b35">먼저 자세 1개 저장·불러오기 검토 → 영상 녹화와 자동 접지는 후속</text></g></svg>