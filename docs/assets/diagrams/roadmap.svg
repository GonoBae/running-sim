<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">개발 순서와 통과 조건</title><desc id="desc">문서 최우선 · 다음 작은 작업은 함께 검토한 뒤 선택</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="560" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">개발 순서와 통과 조건</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">문서 최우선 · 다음 작은 작업은 함께 검토한 뒤 선택</text><g><rect x="40" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">P0 기획과 설계</text><text x="190" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">요구·기술·구조 일치</text></g><g><rect x="410" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="134" width="86" height="24" rx="12" fill="#fff0db"/><text x="469" y="151" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="560" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">P1 입력과 근거</text><text x="560" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">자료·지원 범위·평가 기준</text></g><g><rect x="780" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="134" width="86" height="24" rx="12" fill="#fff0db"/><text x="839" y="151" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="930" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">P2 체형과 자세 재생</text><text x="930" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">치수·각도·접지·좌우 일치</text></g><path d="M 340 186 H 402" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 186 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="780" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="334" width="86" height="24" rx="12" fill="#fff0db"/><text x="839" y="351" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="930" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">P3 기록 모델 검증</text><text x="930" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">비용 → 속도 → 시간 평가</text></g><g><rect x="410" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="334" width="86" height="24" rx="12" fill="#fff0db"/><text x="469" y="351" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="560" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">P4 서비스 통합</text><text x="560" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">설정 → 주행 → 자세 A/B</text></g><g><rect x="40" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="334" width="86" height="24" rx="12" fill="#edf0f2"/><text x="99" y="351" font-size="13" fill="#64707a" text-anchor="middle" font-weight="500">후속</text><text x="190" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">P5 공개 준비</text><text x="190" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">성능·비용·권한·배포</text></g><path d="M 930 252 V 312" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 780 386 H 718" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 410 386 H 348" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="484" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="514" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">P2 고정 페이스 재생은 중간 검증 · 서비스 완료에는 자세별 예상 기록 비교가 필요</text></g></svg>
