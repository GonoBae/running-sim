<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">M01 · 관절 입력 아래 저장 슬롯 하나</title><desc id="desc">검토용 화면 배치 · 미구현 · 캐릭터와 수치는 설명용 예시</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect x="0" y="0" width="1120" height="720" rx="14" fill="#f6f7f2" stroke="#d6ded6"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">M01 · 관절 입력 아래 저장 슬롯 하나</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">검토용 화면 배치 · 미구현 · 캐릭터와 수치는 설명용 예시</text><rect x="40" y="112" width="1040" height="52" rx="14" fill="#e8eee6" stroke="#d6ded6"/><text x="65" y="145" text-anchor="start" font-size="21" fill="#283b35">모델 시험</text><text x="1055" y="145" text-anchor="end" font-size="15" fill="#67756e">정면 / 측면 / 뼈대 보기</text><rect x="40" y="180" width="590" height="420" rx="14" fill="#fff" stroke="#d6ded6"/><text x="65" y="211" text-anchor="start" font-size="18" fill="#283b35">현재 자세 B</text><g transform="translate(335 370)" stroke="#506b58" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cy="-128" r="22" fill="#dce5d6"/><path d="M0 -104L4 -10 M0 -80L-37 -37L-70 -70 M0 -80L44 -48L76 -77 M4 -10L-25 60L-54 124 M4 -10L45 38L32 124"/></g><text x="335" y="573" text-anchor="middle" font-size="17" fill="#67756e">불러오기 → 저장한 각도 A로 변경</text><rect x="650" y="180" width="430" height="165" rx="14" fill="#fff" stroke="#d6ded6"/><text x="675" y="212" text-anchor="start" font-size="20" fill="#283b35">관절 조절</text><text x="675" y="250" text-anchor="start" font-size="17" fill="#67756e">왼쪽 어깨    20°</text><path d="M680 281H1035" stroke="#c8d4c6" stroke-width="5"/><circle cx="865" cy="281" r="7" fill="#bb5835"/><text x="675" y="322" text-anchor="start" font-size="15" fill="#67756e">기존 관절 입력과 기본 자세 복원 유지</text><rect x="650" y="363" width="430" height="237" rx="14" fill="#fff" stroke="#d6ded6"/><text x="675" y="396" text-anchor="start" font-size="20" fill="#283b35">임시 저장한 자세</text><text x="675" y="428" text-anchor="start" font-size="16" fill="#67756e">자세 1개를 저장했습니다.</text><rect x="675" y="448" width="232" height="45" rx="14" fill="#e8eee6" stroke="#d6ded6"/><text x="791" y="477" text-anchor="middle" font-size="16" fill="#283b35">저장한 자세 바꾸기</text><rect x="920" y="448" width="135" height="45" rx="14" fill="#dce7d8" stroke="#d6ded6"/><text x="987.5" y="477" text-anchor="middle" font-size="16" fill="#283b35">불러오기</text><text x="675" y="523" text-anchor="start" font-size="15" fill="#67756e">이 페이지에서만 임시 보관됩니다.</text><text x="675" y="548" text-anchor="start" font-size="15" fill="#67756e">새로고침하면 사라집니다.</text><text x="675" y="577" text-anchor="start" font-size="15" fill="#67756e">키·부위 길이는 현재 값을 유지합니다.</text><rect x="40" y="622" width="1040" height="48" rx="14" fill="#e8eee6" stroke="#d6ded6"/><text x="560" y="652" text-anchor="middle" font-size="17" fill="#283b35">빈 슬롯: [현재 자세 저장] · 불러오기 비활성 / 저장 완료: 위 버튼으로 교체</text><text x="40" y="697" text-anchor="start" font-size="16" fill="#67756e">기존 ‘이 설정 적용’과 별개 · 저장/복원만으로 사용 통계를 늘리지 않는 제안</text></g></svg>