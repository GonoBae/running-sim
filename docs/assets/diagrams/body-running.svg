<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430">
<rect width="1120" height="430" rx="22" fill="#f7f8f5"/><g font-family="Malgun Gothic, sans-serif" fill="#294632">
<text x="32" y="48" font-size="26" font-weight="bold">신체 설정이 달리기에 전달되는 순서</text>
<text x="32" y="80" font-size="15" fill="#748074">M79 · 구현 / 현재 두 모델의 기능·기하 검사 · 인체 물리 검증 아님</text><rect x="32" y="122" width="237" height="146" rx="15" fill="white" stroke="#d5dfd6"/><text x="50" y="160" font-size="19" font-weight="bold">01 신체 재구성</text><text x="50" y="201" font-size="16">피부 + 뼈 길이</text><text x="50" y="232" font-size="16">전체 크기 함께 적용</text><text x="278" y="201" font-size="24" fill="#819779">→</text><rect x="305" y="122" width="237" height="146" rx="15" fill="white" stroke="#d5dfd6"/><text x="323" y="160" font-size="19" font-weight="bold">02 기본 동작 전달</text><text x="323" y="201" font-size="16">확정된 관절 회전</text><text x="323" y="232" font-size="16">새 길이로 움직임</text><text x="551" y="201" font-size="24" fill="#819779">→</text><rect x="578" y="122" width="237" height="146" rx="15" fill="white" stroke="#d5dfd6"/><text x="596" y="160" font-size="19" font-weight="bold">03 바닥 높이 맞춤</text><text x="596" y="201" font-size="16">새 발바닥 높이 측정</text><text x="596" y="232" font-size="16">몸의 수직 위치 조절</text><text x="824" y="201" font-size="24" fill="#819779">→</text><rect x="851" y="122" width="237" height="146" rx="15" fill="white" stroke="#d5dfd6"/><text x="869" y="160" font-size="19" font-weight="bold">04 자세 입력 적용</text><text x="869" y="201" font-size="16">다리: 실제 cm</text><text x="869" y="232" font-size="16">팔: 굽힘 각도 차이</text><rect x="32" y="306" width="1056" height="90" rx="14" fill="#e5eddd"/><text x="55" y="340" font-size="18">기본 신체: 기존 동작 그대로 / 체형 변경: 이전 체형의 준비 결과 교체</text><text x="55" y="373" font-size="16">수평 몸 이동은 다리 길이 배율 반영 · 발바닥 높이 유지와 발 고정·마찰 검증은 구분</text></g></svg>