<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="555" viewBox="0 0 1120 555" role="img" aria-labelledby="title desc"><title id="title">현재 구현과 목표 구조</title><desc id="desc">로컬 시험 결과와 운영 설계를 분리 · 모든 운영 연결은 아직 미완료</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect width="1120" height="555" rx="22" fill="#f6f7f2"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">현재 구현과 목표 구조</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">로컬 시험 결과와 운영 설계를 분리 · 모든 운영 연결은 아직 미완료</text><g><rect x="40" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="147" text-anchor="start" font-size="13" fill="#387148">로컬 구현 완료</text><text x="190" y="182" text-anchor="middle" font-size="21" fill="#283b35">브라우저 시험 화면</text><text x="190" y="212" text-anchor="middle" font-size="16" fill="#67756e">남성형·여성형 · 길이 · 자세</text></g><g><rect x="410" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="147" text-anchor="start" font-size="13" fill="#387148">로컬 구현 완료</text><text x="560" y="182" text-anchor="middle" font-size="21" fill="#283b35">로컬 관리자</text><text x="560" y="212" text-anchor="middle" font-size="16" fill="#67756e">모델 시험 · 제한 · 통계</text></g><g><rect x="780" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="147" text-anchor="start" font-size="13" fill="#387148">로컬 구현 완료</text><text x="930" y="182" text-anchor="middle" font-size="21" fill="#283b35">브라우저 저장소</text><text x="930" y="212" text-anchor="middle" font-size="16" fill="#67756e">파일 / 설정 / 사용 이벤트</text></g><path d="M340 190 L400 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M710 190 L770 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><g><rect x="40" y="320" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="347" text-anchor="start" font-size="13" fill="#996334">배포 방향 확정</text><text x="190" y="382" text-anchor="middle" font-size="21" fill="#283b35">서비스 웹 · Vercel</text><text x="190" y="412" text-anchor="middle" font-size="16" fill="#67756e">체형 → 동작 → 코스 → 주행</text></g><g><rect x="410" y="320" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="347" text-anchor="start" font-size="13" fill="#996334">연결 전</text><text x="560" y="382" text-anchor="middle" font-size="21" fill="#283b35">Supabase · 운영 서버</text><text x="560" y="412" text-anchor="middle" font-size="16" fill="#67756e">인증 · 게시 버전 · 통계</text></g><g><rect x="780" y="320" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="347" text-anchor="start" font-size="13" fill="#996334">모델·호스팅 미선정</text><text x="930" y="382" text-anchor="middle" font-size="21" fill="#283b35">계산 서비스</text><text x="930" y="412" text-anchor="middle" font-size="16" fill="#67756e">자세에 따른 예상 기록</text></g><path d="M340 390 L400 390" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M710 390 L770 390" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="490" width="1040" height="46" rx="12" fill="#e8eee6"/><text x="560" y="519" text-anchor="middle" font-size="16" fill="#283b35">동작 편집·고정 페이스 재생은 브라우저 우선 제안 · 기록 효과 계산은 별도 검증</text></g></svg>