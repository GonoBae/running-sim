<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="455" viewBox="0 0 1120 455"><rect width="1120" height="455" fill="#f7f8f5"/><g font-family="Malgun Gothic, sans-serif"><text x="28" y="42" font-size="27" fill="#294632" font-weight="600">첫 구현은 코스 확인 · 설정 전달까지</text><text x="28" y="76" font-size="17" fill="#7b887a" font-weight="400">M85 문서 작업 완료 후 검토할 순서 / 아래 기능 구현은 아직 승인·착수 전</text><rect x="28" y="111" width="508" height="276" rx="14" fill="#e3edd9" stroke="#dce2d8"/><text x="50" y="151" font-size="23" fill="#294632" font-weight="600">포함 제안</text><text x="52" y="194" font-size="18" fill="#294632" font-weight="400">• 실제 경로 1개를 지도에 표시</text><text x="52" y="231" font-size="18" fill="#294632" font-weight="400">• 출발점 · 방향 · 바퀴 수</text><text x="52" y="268" font-size="18" fill="#294632" font-weight="400">• 검증된 길이로 총 거리 계산</text><text x="52" y="305" font-size="18" fill="#294632" font-weight="400">• 현재 러너 · 자세 요약 유지</text><text x="52" y="342" font-size="18" fill="#294632" font-weight="400">• 이전·다음·새로고침 유지</text><rect x="584" y="111" width="508" height="276" rx="14" fill="white" stroke="#dce2d8"/><text x="606" y="151" font-size="23" fill="#294632" font-weight="600">후속으로 분리</text><text x="608" y="194" font-size="18" fill="#294632" font-weight="400">• 코스 위 3D 주행 · 발 미끄러짐 검사</text><text x="608" y="231" font-size="18" fill="#294632" font-weight="400">• 경사 · 노면 · 날씨 계산</text><text x="608" y="268" font-size="18" fill="#294632" font-weight="400">• NRC 자동 연동 · 파일 업로드 UI</text><text x="608" y="305" font-size="18" fill="#294632" font-weight="400">• 지도 검색 · 여러 코스 관리</text><text x="608" y="342" font-size="18" fill="#294632" font-weight="400">• 자세별 기록 예측 · 백테스팅 실행</text><text x="28" y="426" font-size="16" fill="#7b887a" font-weight="400">완료 기준 제안: 원래 신체·자세 값 동일 / 잘못된 경로는 진행 차단 / 미확인 거리는 숫자로 표시하지 않음</text></g></svg>