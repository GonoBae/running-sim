<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="635" viewBox="0 0 1120 635" role="img" aria-labelledby="title desc"><title id="title">문서는 docs/에서 관리합니다</title><desc id="desc">초안 작성 여부와 최종 확정 여부는 다릅니다. 상태는 문서 목록에서 확인합니다.</desc><rect width="1120" height="635" rx="22" fill="#f5f7f1"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="40" y="48" font-size="28" fill="#304337" text-anchor="start">문서는 docs/에서 관리합니다</text><text x="40" y="80" font-size="16" fill="#6b786e" text-anchor="start">초안 작성 여부와 최종 확정 여부는 다릅니다. 상태는 문서 목록에서 확인합니다.</text><g><rect x="40" y="115" width="320" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="200" y="151" font-size="22" fill="#304337" text-anchor="middle">01 · 기획</text><text x="200" y="187" font-size="16" fill="#6b786e" text-anchor="middle">서비스 목적 · 진행 방식</text><text x="200" y="213" font-size="16" fill="#6b786e" text-anchor="middle">결정 기록 · 개발 계획</text></g><g><rect x="400" y="115" width="320" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="560" y="151" font-size="22" fill="#304337" text-anchor="middle">02 · 요구사항</text><text x="560" y="187" font-size="16" fill="#6b786e" text-anchor="middle">R01–R14 기능 요구</text><text x="560" y="213" font-size="16" fill="#6b786e" text-anchor="middle">검수 기준 · 미정 항목</text></g><g><rect x="760" y="115" width="320" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="920" y="151" font-size="22" fill="#304337" text-anchor="middle">03 · 화면</text><text x="920" y="187" font-size="16" fill="#6b786e" text-anchor="middle">전체 화면 정의</text><text x="920" y="213" font-size="16" fill="#6b786e" text-anchor="middle">캐릭터 · 동작 · 코스 · 관리자</text></g><g><rect x="40" y="285" width="320" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="200" y="321" font-size="22" fill="#304337" text-anchor="middle">04 · 기술</text><text x="200" y="357" font-size="16" fill="#6b786e" text-anchor="middle">기술내역 · 아키텍처</text><text x="200" y="383" font-size="16" fill="#6b786e" text-anchor="middle">데이터 · 체형 자산</text></g><g><rect x="400" y="285" width="320" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="560" y="321" font-size="22" fill="#304337" text-anchor="middle">05 · 검증</text><text x="560" y="357" font-size="16" fill="#6b786e" text-anchor="middle">확인한 범위와 제약</text><text x="560" y="383" font-size="16" fill="#6b786e" text-anchor="middle">reports/ 원본 수치</text></g><g><rect x="760" y="285" width="320" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="920" y="321" font-size="22" fill="#304337" text-anchor="middle">06 · 가이드</text><text x="920" y="357" font-size="16" fill="#6b786e" text-anchor="middle">실행 · 모델 준비</text><text x="920" y="383" font-size="16" fill="#6b786e" text-anchor="middle">MPFB 설치 · GLB 내보내기</text></g><g><rect x="40" y="455" width="500" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="290" y="491" font-size="22" fill="#304337" text-anchor="middle">07 · 참고자료</text><text x="290" y="527" font-size="16" fill="#6b786e" text-anchor="middle">연구 후보 · 출처·확인 범위</text><text x="290" y="553" font-size="16" fill="#6b786e" text-anchor="middle">자산 정보와 체크섬</text></g><g><rect x="580" y="455" width="500" height="130" rx="15" fill="white" stroke="#d8e0d8"/><text x="830" y="491" font-size="22" fill="#304337" text-anchor="middle">assets · 공용 그림</text><text x="830" y="527" font-size="16" fill="#6b786e" text-anchor="middle">도식 · 이미지 · 생성 프롬프트</text><text x="830" y="553" font-size="16" fill="#6b786e" text-anchor="middle">이전 시안은 images/archive/</text></g></g></svg>