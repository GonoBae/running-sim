<g><rect x="695" y="38" width="186" height="84" rx="10" fill="#e4ece1"/><text x="788" y="75">전체 배율</text><text x="788" y="100">유지</text></g>
<g><rect x="920" y="38" width="180" height="84" rx="10" fill="#354c3c"/><text x="1010" y="75" fill="#fff">실제 관절 길이</text><text x="1010" y="100" fill="#fff">cm 표시</text></g>
</g></svg>
