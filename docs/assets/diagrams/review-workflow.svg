<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="545" viewBox="0 0 1120 545" role="img" aria-labelledby="title desc"><title id="title">문서 먼저, 작은 작업 하나씩</title><desc id="desc">확정된 협업 방식 · 기능 실험은 합의한 범위에서 문서 작업과 병행 가능</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect width="1120" height="545" rx="22" fill="#f6f7f2"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">문서 먼저, 작은 작업 하나씩</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">확정된 협업 방식 · 기능 실험은 합의한 범위에서 문서 작업과 병행 가능</text><g><rect x="40" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="147" text-anchor="start" font-size="13" fill="#996334">확정</text><text x="190" y="182" text-anchor="middle" font-size="21" fill="#283b35">01 설명과 문서</text><text x="190" y="212" text-anchor="middle" font-size="16" fill="#67756e">목적 · 그림 · 작업 범위</text></g><g><rect x="410" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="147" text-anchor="start" font-size="13" fill="#996334">확정</text><text x="560" y="182" text-anchor="middle" font-size="21" fill="#283b35">02 함께 검토</text><text x="560" y="212" text-anchor="middle" font-size="16" fill="#67756e">선택 · 보류 · 수정</text></g><g><rect x="780" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="147" text-anchor="start" font-size="13" fill="#996334">확정</text><text x="930" y="182" text-anchor="middle" font-size="21" fill="#283b35">03 작은 작업 하나</text><text x="930" y="212" text-anchor="middle" font-size="16" fill="#67756e">검토한 범위만 구현</text></g><path d="M340 190 L400 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M710 190 L770 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><g><rect x="780" y="315" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="342" text-anchor="start" font-size="13" fill="#996334">확정</text><text x="930" y="377" text-anchor="middle" font-size="21" fill="#283b35">04 코드와 설명</text><text x="930" y="407" text-anchor="middle" font-size="16" fill="#67756e">변경 코드 · 동작 · 검사 결과</text></g><g><rect x="410" y="315" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="342" text-anchor="start" font-size="13" fill="#996334">확정</text><text x="560" y="377" text-anchor="middle" font-size="21" fill="#283b35">05 다음 단계 검토</text><text x="560" y="407" text-anchor="middle" font-size="16" fill="#67756e">검토 후 다음 작업 선택</text></g><g><rect x="40" y="315" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="342" text-anchor="start" font-size="13" fill="#996334">확정</text><text x="190" y="377" text-anchor="middle" font-size="21" fill="#283b35">문서에 반영</text><text x="190" y="407" text-anchor="middle" font-size="16" fill="#67756e">결정과 검증 상태 갱신</text></g><path d="M930 265 L930 305" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M780 385 L720 385" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M410 385 L350 385" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="485" width="1040" height="46" rx="12" fill="#e8eee6"/><text x="560" y="514" text-anchor="middle" font-size="16" fill="#283b35">실험 결과가 좋아도 다음 기능을 자동으로 확정하거나 구현하지 않습니다.</text></g></svg>