<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410"><rect width="1120" height="410" rx="22" fill="#f3f6f1"/><g font-family="Malgun Gothic, sans-serif"><text x="40" y="47" font-size="28" fill="#293c32">M11 · 보이는 부위만 선택</text><text x="40" y="79" font-size="16" fill="#66796a">확정: 오른쪽 아래팔 비교 실험 + 양쪽 점 가림 / 로컬 검사 완료 · 사용감은 사용자 검토</text><rect x="40" y="110" width="300" height="92" rx="14" fill="white" stroke="#d3ded4"/><text x="58" y="142" font-size="22" fill="#293c32">아래팔 표면 클릭</text><text x="58" y="172" font-size="16" fill="#66796a">보이는 오른쪽 아래팔만 선택</text><path d="M350 155h37l-7-6m7 6-7 6" stroke="#82978a" fill="none" stroke-width="2"/><rect x="400" y="110" width="300" height="92" rx="14" fill="white" stroke="#d3ded4"/><text x="418" y="142" font-size="22" fill="#293c32">부위 강조 + 드래그</text><text x="418" y="172" font-size="16" fill="#66796a">위로 굽힘 · 아래로 펴기</text><path d="M710 155h37l-7-6m7 6-7 6" stroke="#82978a" fill="none" stroke-width="2"/><rect x="760" y="110" width="300" height="92" rx="14" fill="white" stroke="#d3ded4"/><text x="778" y="142" font-size="22" fill="#293c32">팔꿈치 각도 반영</text><text x="778" y="172" font-size="16" fill="#66796a">점 입력과 같은 제한·취소·숫자</text><rect x="40" y="228" width="300" height="92" rx="14" fill="white" stroke="#d3ded4"/><text x="58" y="260" font-size="22" fill="#293c32">팔꿈치 점 클릭</text><text x="58" y="290" font-size="16" fill="#66796a">실제 관절 위치의 점 유지</text><path d="M350 274h37l-7-6m7 6-7 6" stroke="#82978a" fill="none" stroke-width="2"/><rect x="400" y="228" width="300" height="92" rx="14" fill="white" stroke="#d3ded4"/><text x="418" y="260" font-size="22" fill="#293c32">같은 드래그 처리</text><text x="418" y="290" font-size="16" fill="#66796a">한 번에 하나만 조작</text><path d="M710 274h37l-7-6m7 6-7 6" stroke="#82978a" fill="none" stroke-width="2"/><rect x="760" y="228" width="300" height="92" rx="14" fill="white" stroke="#d3ded4"/><text x="778" y="260" font-size="22" fill="#293c32">가려진 점은 숨김</text><text x="778" y="290" font-size="16" fill="#66796a">몸·반대 팔 뒤를 관통하지 않음</text><text x="40" y="371" font-size="19" fill="#293c32">가려졌다면: 화면 회전 / 좌측면·우측면 버튼 / 부위 목록의 숫자 입력</text></g></svg>
