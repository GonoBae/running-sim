<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340">
<rect width="1120" height="340" rx="20" fill="#f7f8f5"/><g font-family="Malgun Gothic,sans-serif" fill="#294632">
<text x="28" y="45" font-size="25" font-weight="bold">몸 위에서 바꾼 값으로, 다시 달리기</text>
<text x="28" y="76" font-size="15" fill="#748074">M81 · 기존 신체·달리기 유지 / 새 입력을 기존 두 자세 설정에 연결</text><rect x="28" y="113" width="243" height="143" rx="14" fill="white" stroke="#d5dfd6"/><text x="43" y="150" font-size="18" font-weight="bold">01 다리·아래팔 잡기</text><text x="43" y="190" font-size="15">보이는 피부만 선택</text><text x="43" y="222" font-size="14">움직이던 러너 일시정지</text><text x="276" y="193" font-size="21">→</text><rect x="301" y="113" width="243" height="143" rx="14" fill="white" stroke="#d5dfd6"/><text x="316" y="150" font-size="18" font-weight="bold">02 위아래 드래그</text><text x="316" y="190" font-size="15">다리: 더 높이 / 낮게</text><text x="316" y="222" font-size="14">팔: 더 굽히기 / 펴기</text><text x="549" y="193" font-size="21">→</text><rect x="574" y="113" width="243" height="143" rx="14" fill="white" stroke="#d5dfd6"/><text x="589" y="150" font-size="18" font-weight="bold">03 같은 설정값</text><text x="589" y="190" font-size="15">leg / elbow만 갱신</text><text x="589" y="222" font-size="14">양쪽 공통 · 신체 값 유지</text><text x="822" y="193" font-size="21">→</text><rect x="847" y="113" width="243" height="143" rx="14" fill="white" stroke="#d5dfd6"/><text x="862" y="150" font-size="18" font-weight="bold">04 재생으로 확인</text><text x="862" y="190" font-size="15">기존 기본 동작에 반영</text><text x="862" y="222" font-size="14">코스 → 백테스팅 값 유지</text><text x="28" y="300" font-size="16">다리는 선택한 쪽 들림 확인 시점 · 아래팔은 현재 시점 / Esc로 시작 값·시점 복원</text></g></svg>