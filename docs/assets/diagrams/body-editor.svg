<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300">
<rect width="1120" height="300" rx="20" fill="#f7f8f5"/><g font-family="Malgun Gothic,sans-serif" fill="#294632">
<text x="28" y="43" font-size="25" font-weight="bold">설정창 대신, 신체 위에서 조절</text>
<text x="28" y="75" font-size="15" fill="#748074">M80 · 사용자 확정 / 구현 화면 및 입력 검사 · 자세 회전 조작은 별도</text><rect x="28" y="112" width="243" height="149" rx="14" fill="white" stroke="#d5dfd6"/><text x="44" y="149" font-size="18" font-weight="bold">01 부위 잡기</text><text x="44" y="191" font-size="15">보이는 피부 또는 화살표</text><text x="44" y="222" font-size="13">가려진 반대쪽은 선택 제외</text><text x="276" y="192" font-size="21">→</text><rect x="301" y="112" width="243" height="149" rx="14" fill="white" stroke="#d5dfd6"/><text x="317" y="149" font-size="18" font-weight="bold">02 길이 조절</text><text x="317" y="191" font-size="15">부위 방향으로 드래그</text><text x="317" y="222" font-size="13">치수 표시 · 제한 · Esc 취소</text><text x="549" y="192" font-size="21">→</text><rect x="574" y="112" width="243" height="149" rx="14" fill="white" stroke="#d5dfd6"/><text x="590" y="149" font-size="18" font-weight="bold">03 같은 신체 값</text><text x="590" y="191" font-size="15">피부와 뼈대 함께 변경</text><text x="590" y="222" font-size="13">전체 크기는 화면 안 ↕</text><text x="822" y="192" font-size="21">→</text><rect x="847" y="112" width="243" height="149" rx="14" fill="white" stroke="#d5dfd6"/><text x="863" y="149" font-size="18" font-weight="bold">04 달리기에 전달</text><text x="863" y="191" font-size="15">기존 다리 들림 · 팔 굽힘</text><text x="863" y="222" font-size="13">신체 → 자세 → 코스 → 백테스팅</text></g></svg>