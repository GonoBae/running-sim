"#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="945" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">A/B 비교</text><text x="945" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">자세 외 조건 일치 검사</text></g><path d="M 945 258 V 312" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="235" y="524" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="251" y="538" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="294" y="555" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="370" y="588" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">왼쪽 트랙</text><text x="370" y="615" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">실제 경로 위의 러너</text></g><g><rect x="580" y="524" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="596" y="538" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="639" y="555" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="715" y="588" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">오른쪽 자세</text><text x="715" y="615" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">동일 순간 · 전신 확대</text></g><path d="M 560 452 V 484 H 370 V 516" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 560 484 H 715 V 516" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>
