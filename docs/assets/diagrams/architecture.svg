<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title desc"><title id="title">하나의 실행 결과로 두 화면을 재생</title><desc id="desc">설계안 · 현재는 로컬 모델·관절·관리자 시험까지 구현</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="704" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">하나의 실행 결과로 두 화면을 재생</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">설계안 · 현재는 로컬 모델·관절·관리자 시험까지 구현</text><g><rect x="40" y="126" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="140" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="157" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="175" y="190" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">설정 확정</text><text x="175" y="217" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">체형·자세·코스·실행 방식</text></g><g><rect x="425" y="126" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="441" y="140" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="484" y="157" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="190" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">실행 엔진</text><text x="560" y="217" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">동작 생성 + 경로 + 계산</text></g><g><rect x="810" y="126" width="270" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="826" y="140" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="869" y="157" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><t