<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#598673"/></marker></defs><rect width="1120" height="660" fill="#f5f7f3"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="46" font-size="30" fill="#203c34">달리는 자세 만들기</text><text x="36" y="78" font-size="17" fill="#203c34">SCR03 화면 배치 제안 · 미구현 · 자세 종류와 조작 방식은 검토 대상</text><rect x="36" y="104" width="650" height="500" rx="18" fill="#ffffff" stroke="#ccd9d2"/><text x="60" y="141" font-size="22" fill="#203c34">자세 조절 / 달리기 미리보기</text><g transform="translate(350 350) scale(1.35)" fill="none" stroke="#345e4f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="-102" r="18" fill="#d6e5dc"/><path d="M5 -77 L-8 -12 M0 -60 L-34 -38 L-55 -63 M0 -60 L35 -45 L57 -65 M-8 -12 L42 8 L38 65 L65 65 M-8 -12 L-40 35 L-65 58 L-47 65"/></g><path d="M120 453 H600" stroke="#ccd9d2" stroke-width="2"/><text x="60" y="490" font-size="17" fill="#203c34">정면 · 측면 보기</text><rect x="60" y="518" width="170" height="58" rx="18" fill="#d6e5dc" stroke="#ccd9d2"/><text x="88" y="555" font-size="20" fill="#203c34">▶ 달리기 재생</text><rect x="246" y="518" width="120" height="58" rx="18" fill="#ffffff" stroke="#ccd9d2"/><text x="279" y="555" font-size="20" fill="#203c34">정지</text><text x="396" y="554" font-size="18" fill="#203c34">↻ 반복 미리보기</text><rect x="710" y="104" width="374" height="500" rx="18" fill="#ffffff" stroke="#ccd9d2"/><text x="734" y="145" font-size="24" fill="#203c34">주요 자세</text><text x="734" y="181" font-size="20" fill="#203c34">다리 올림  /  회수  /  착지</text><rect x="734" y="205" width="326" height="110" rx="18" fill="#edf3ed" stroke="#ccd9d2"/><text x="754" y="243" font-size="21" fill="#203c34">선택한 자세를 조절</text><text x="754" y="280" font-size="17" fill="#203c34">허용 방향 · 범위 안에서 입력</text><text x="734" y="358" font-size="22" fill="#203c34">착지 방식</text><text x="734" y="394" font-size="19" fill="#203c34">뒤꿈치  /  미드풋  /  앞꿈치</text><text x="734" y="428" font-size="16" fill="#203c34">선택이 발 접촉으로 이어지는지 검증</text><text x="734" y="493" font-size="19" fill="#203c34">입력 → 캐릭터 자세 확인</text><text x="734" y="530" font-size="19" fill="#203c34">재생 → 수정 → 다시 재생</text><text x="734" y="571" font-size="16" fill="#203c34">프레임·시각 수동 배치는 필수 아님</text><text x="36" y="638" font-size="17" fill="#203c34">그림의 캐릭터는 배치 설명용 도형입니다. 실제 모델 화면이나 접지 검증 결과가 아닙니다.</text></g></svg>
