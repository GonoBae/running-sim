" font-size="14" fill="#718277" font-weight="400">좌표 기준 대응 전에는 차이를 계산하지 않음</text><text x="1125" y="677" font-size="16" fill="#243c34" font-weight="400">측면  /  정면</text><text x="1125" y="706" font-size="13" fill="#718277" font-weight="400">값은 실행 후 표시</text><rect x="32" y="743" width="1376" height="233" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="54" y="774" font-size="20" fill="#243c34" font-weight="400">한 주기 각도 변화</text><text x="890" y="772" font-size="15" fill="#bb6848" font-weight="400">● 내 설정</text><text x="1010" y="772" font-size="15" fill="#237864" font-weight="400">● 참고 자료</text><text x="1160" y="772" font-size="13" fill="#718277" font-weight="400">예시 곡선 · 측정값 아님</text><path d="M94 804L94 897" fill="none" stroke="#ced8ce" stroke-width="2"/><path d="M94 897L1358 897" fill="none" stroke="#ced8ce" stroke-width="2"/><text x="58" y="824" font-size="13" fill="#718277" font-weight="400">각도</text><text x="62" y="845" font-size="13" fill="#718277" font-weight="400">(°)</text><path d="M94 862C230 854 310 798 420 836S660 893 800 851S1010 782 1120 833S1280 871 1358 862" fill="none" stroke="#bb6848" stroke-width="3"/><path d="M94 873C240 879 330 815 440 853S660 883 800 873S1010 789 1120 847S1280 866 1358 873" fill="none" stroke="#237864" stroke-width="3"/><path d="M726 795V900" stroke="#243c34" stroke-dasharray="4 4"/><text x="85" y="917" font-size="13" fill="#718277" font-weight="400">0%</text><text x="710" y="917" font-size="13" fill="#718277" font-weight="400">50%</text><text x="1320" y="917" font-size="13" fill="#718277" font-weight="400">100%</text><text x="54" y="954" font-size="16" fill="#243c34" font-weight="400">▶ 재생     0.5× / 1×     ↺ 처음</text><text x="531" y="954" font-size="16" fill="#237864" font-weight="400">진행률 50%  ─────●─────  두 화면 함께 이동</text><text x="32" y="1008" font-size="16" fill="#718277" font-weight="400">자료와의 차이를 보여주는 화면입니다. 일치율·최적 자세·기록 향상 점수로 표시하지 않습니다.</text><text x="32" y="1037" font-size="14" fill="#718277" font-weight="400">R16 / SCR08 · 