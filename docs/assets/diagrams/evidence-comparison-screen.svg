<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060"><rect width="1440" height="1060" fill="#f7f8f3"/><g font-family="Malgun Gothic, sans-serif"><text x="32" y="42" font-size="28" fill="#243c34" font-weight="400">SCR08 · 근거 기반 자세 비교</text><rect x="1035" y="18" width="370" height="30" rx="15" fill="#edf3ed" stroke="#d9e1d9"/><text x="1047" y="39" font-size="13" fill="#237864" font-weight="600">화면 설계 제안 · 미구현 · 도형/곡선은 예시</text><rect x="32" y="69" width="1376" height="73" rx="16" fill="#fff" stroke="#d9e1d9"/><text x="54" y="99" font-size="16" fill="#243c34" font-weight="400">← 자세 설정</text><text x="54" y="125" font-size="15" fill="#718277" font-weight="400">내 러너와 자료를 같은 진행률에서 살펴보세요.</text><rect x="528" y="90" width="215" height="30" rx="15" fill="#edf3ed" stroke="#d9e1d9"/><text x="540" y="111" font-size="13" fill="#237864" font-weight="600">내 설정 ↔ 참고 자료</text><text x="781" y="115" font-size="16" fill="#718277" font-weight="400">변경 전 ↔ 변경 후  · 후속</text><rect x="1215" y="87" width="171" height="38" rx="8" fill="#eaf2ea" stroke="#d9e1d9"/><text x="1233" y="112" font-size="16" fill="#237864" font-weight="400">자료 선택 · 출처</text><rect x="32" y="159" width="1376" height="59" rx="16" fill="#eef3eb" stroke="#d9e1d9"/><text x="52" y="184" font-size="17" fill="#237864" font-weight="600">자료  AB01 · 평지 s2x0 · 왼발 35주기 평균</text><text x="52" y="205" font-size="13" fill="#718277" font-weight="400">명령 속도 2.060804 m/s · 주기 중앙값 0.78초 · Reznick 2021 / CC0</text><text x="960" y="184" font-size="16" fill="#bb6848" font-weight="400">같은 진행률 ≠ 같은 실제 시간</text><text x="960" y="205" font-size="13" fill="#718277" font-weight="400">내 조건과 자료 조건의 차이 보기 ↗</text><rect x="32" y="234" width="680" height="398" rx="16" fill="#fff" stroke="#d9e1d9"/><rect x="728" y="234" width="680" height="398" rx="16" fill="#fff" stroke="#d9e1d9"/><rect x="54" y="252" width="112" height="30" rx="15" fill="#edf3ed" stroke="#d9e1d9"/><text x="66" y="273" font-size="13" fill="#237864" fon