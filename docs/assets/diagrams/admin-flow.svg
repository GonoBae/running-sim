<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">사용자와 관리자의 연결</title><desc id="desc">운영 구조 제안 · 현재는 브라우저 안의 로컬 시험만 구현</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="570" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">사용자와 관리자의 연결</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">운영 구조 제안 · 현재는 브라우저 안의 로컬 시험만 구현</text><g><rect x="40" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="134" width="86" height="24" rx="12" fill="#fff0db"/><text x="99" y="151" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="190" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">관리자 로그인</text><text x="190" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">서버 권한 확인</text></g><g><rect x="410" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="469" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">모델과 설정 검증</text><text x="560" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">모델 버전·각도·노출 항목</text></g><g><rect x="780" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="839" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="930" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">게시 버전</text><text x="930" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">사용자는 게시 설정만 읽기</text></g><path d="M 340 186 H 402" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 186 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="780" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="334" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="839" y="351" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="930" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">사용자 설정 확정</text><text x="930" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">남성형/여성형 · 자세 · 체형</text></g><g><rect x="410" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="334" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="469" y="351" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">사용 이벤트 수집</text><text x="560" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">중복·범위 검사 · 시험 제외</text></g><g><rect x="40" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="334" width="86" height="24" rx="12" fill="#e5f2eb"/><text x="99" y="351" font-size="13" fill="#276648" text-anchor="middle" font-weight="500">확정</text><text x="190" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">관리자 통계</text><text x="190" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">접속 · 인기 자세 · 인기 체형</text></g><path d="M 930 252 V 312" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 780 386 H 718" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 410 386 H 348" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="492" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="522" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">현재 로컬: 모델 파일은 IndexedDB · 설정·사용 기록은 같은 브라우저에만 저장</text></g></svg>
