<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">자세에서 예상 기록까지</title><desc id="desc">연결 구조 제안 · 비용 함수·노력 정책·해법 모두 선정 전</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="560" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">자세에서 예상 기록까지</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">연결 구조 제안 · 비용 함수·노력 정책·해법 모두 선정 전</text><g><rect x="40" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">조건 고정</text><text x="190" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">체형·능력·노력·코스·자세</text></g><g><rect x="410" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="134" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="469" y="151" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">속도 후보</text><text x="560" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">모델 지원 범위 안에서</text></g><g><rect x="780" y="120" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="134" width="86" height="24" rx="12" fill="#fff0db"/><text x="839" y="151" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="930" y="184" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">동작 생성과 측정</text><text x="930" y="211" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">각도·주기·접지 확인</text></g><path d="M 340 186 H 402" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 186 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="780" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="334" width="86" height="24" rx="12" fill="#fff0db"/><text x="839" y="351" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="930" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">비용 계산</text><text x="930" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">실제 생성 동작 / 명시한 특징</text></g><g><rect x="410" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="334" width="86" height="24" rx="12" fill="#fff0db"/><text x="469" y="351" font-size="13" fill="#886024" text-anchor="middle" font-weight="500">미검증</text><text x="560" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">노력 조건 확인</text><text x="560" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">불일치 → 속도 후보 재검토</text></g><g><rect x="40" y="320" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="334" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="351" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="384" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">최종 실행 자료</text><text x="190" y="411" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">동작 + 속도 + 예상 시간</text></g><path d="M 930 252 V 312" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 780 386 H 718" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 410 386 H 348" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="379" y="375" font-size="15" fill="#63717d" text-anchor="middle" font-weight="500">충족</text><path d="M 560 320 V 260" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="290" font-size="15" fill="#63717d" text-anchor="middle" font-weight="500">반복</text><rect x="40" y="484" width="1040" height="48" rx="12" fill="#edf0f2"/><text x="560" y="514" font-size="17" fill="#27313b" text-anchor="middle" font-weight="500">생성 불가 / 범위 밖 / 해 없음 → 계산 불가 · 보기 배속은 예상 기록에 영향 없음</text></g></svg>
