<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">체형 조절을 웹으로 가져오는 구조</title><desc id="desc">앞부분은 확인 완료 · 체형과 길이 조절을 함께 쓰는 연결 방식은 검토 제안</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#90a297"/></marker></defs><rect width="1120" height="550" rx="22" fill="#f6f7f2"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="40" y="48" text-anchor="start" font-size="28" fill="#283b35">체형 조절을 웹으로 가져오는 구조</text><text x="40" y="80" text-anchor="start" font-size="16" fill="#67756e">앞부분은 확인 완료 · 체형과 길이 조절을 함께 쓰는 연결 방식은 검토 제안</text><g><rect x="40" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="147" text-anchor="start" font-size="13" fill="#387148">원본 데이터 확인 완료</text><text x="190" y="182" text-anchor="middle" font-size="21" fill="#283b35">MakeHuman · MPFB</text><text x="190" y="212" text-anchor="middle" font-size="16" fill="#67756e">머리 형태 · 가슴 · 근육 · 살집</text></g><g><rect x="410" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="560" y="182" text-anchor="middle" font-size="21" fill="#283b35">웹 항목 선택</text><text x="560" y="212" text-anchor="middle" font-size="16" fill="#67756e">이름 · 기준값 · 조절 범위</text></g><g><rect x="780" y="120" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="147" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="930" y="182" text-anchor="middle" font-size="21" fill="#283b35">변형 데이터 준비</text><text x="930" y="212" text-anchor="middle" font-size="16" fill="#67756e">필요한 변형 + 뼈대 대응</text></g><path d="M340 190 L400 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M710 190 L770 190" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><g><rect x="780" y="315" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="800" y="342" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="930" y="377" text-anchor="middle" font-size="21" fill="#283b35">웹에서 체형 적용</text><text x="930" y="407" text-anchor="middle" font-size="16" fill="#67756e">원본 기준에서 외형 재계산</text></g><g><rect x="410" y="315" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="430" y="342" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="560" y="377" text-anchor="middle" font-size="21" fill="#283b35">길이·뼈대 함께 적용</text><text x="560" y="407" text-anchor="middle" font-size="16" fill="#67756e">변형 순서와 조합 검사</text></g><g><rect x="40" y="315" width="300" height="142" rx="15" fill="#fff" stroke="#d6ded6"/><text x="60" y="342" text-anchor="start" font-size="13" fill="#996334">설계 제안</text><text x="190" y="377" text-anchor="middle" font-size="21" fill="#283b35">자세·프레임 재생</text><text x="190" y="407" text-anchor="middle" font-size="16" fill="#67756e">실제 관절값 검사</text></g><path d="M930 265 L930 305" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M780 385 L720 385" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><path d="M410 385 L350 385" stroke="#90a297" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="489" width="1040" height="46" rx="12" fill="#e8eee6"/><text x="560" y="518" text-anchor="middle" font-size="16" fill="#283b35">현재 길이 편집은 기존 변형을 굳혀 적용합니다. 체형 슬라이더를 바로 덧붙일 수 없습니다.</text></g></svg>