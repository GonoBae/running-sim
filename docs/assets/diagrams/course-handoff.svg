<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1135" height="444" viewBox="0 0 1135 444"><rect width="1135" height="444" fill="#f7f8f5"/><g font-family="Malgun Gothic, sans-serif"><text x="28" y="42" font-size="27" fill="#294632" font-weight="600">신체 · 자세를 그대로 전달하고 코스만 추가</text><text x="28" y="76" font-size="17" fill="#7b887a" font-weight="400">기존 전달: 소스 확인 / 코스 저장 구조: 설계 제안 · 미구현</text><rect x="28" y="112" width="247" height="210" rx="14" fill="white" stroke="#dce2d8"/><rect x="44" y="128" width="130" height="30" rx="15" fill="#e3edd9" stroke="none"/><text x="56" y="149" font-size="14" fill="#294632" font-weight="600">기존 구현</text><text x="44" y="192" font-size="22" fill="#294632" font-weight="600">01  신체</text><text x="44" y="228" font-size="16" fill="#294632" font-weight="400">model · scale</text><text x="44" y="257" font-size="16" fill="#294632" font-weight="400">ratios 6개</text><text x="44" y="294" font-size="14" fill="#7b887a" font-weight="400">남녀 / 크기 / 부위 길이</text><text x="282" y="228" font-size="20" fill="#7b887a" font-weight="400">→</text><rect x="305" y="112" width="247" height="210" rx="14" fill="white" stroke="#dce2d8"/><rect x="321" y="128" width="130" height="30" rx="15" fill="#e3edd9" stroke="none"/><text x="333" y="149" font-size="14" fill="#294632" font-weight="600">기존 구현</text><text x="321" y="192" font-size="22" fill="#294632" font-weight="600">02  자세</text><text x="321" y="228" font-size="16" fill="#294632" font-weight="400">leg · elbow · lean</text><text x="321" y="257" font-size="16" fill="#294632" font-weight="400">strike</text><text x="321" y="294" font-size="14" fill="#7b887a" font-weight="400">다리 / 팔 / 상체 / 착지</text><text x="559" y="228" font-size="20" fill="#7b887a" font-weight="400">→</text><rect x="582" y="112" width="247" height="210" rx="14" fill="white" stroke="#dce2d8"/><rect x="598" y="128" width="130" height="30" rx="15" fill="#f8edda" stroke="none"/><text x="610" y="149" font-size="14" fill="#996526" font-weight="600">설계 제안</text><text x="598" y="192" font-size="22" fill="#294632" font-weight="600">03  코스</text><text x="598" y="228" font-size="16" fill="#294632" font-weight="400">course 초안 추가</text><text x="598" y="257" font-size="16" fill="#294632" font-weight="400">원래 값 덮어쓰기 없음</text><text x="598" y="294" font-size="14" fill="#7b887a" font-weight="400">경로 / 출발 / 방향 / 바퀴</text><text x="836" y="228" font-size="20" fill="#7b887a" font-weight="400">→</text><rect x="859" y="112" width="247" height="210" rx="14" fill="white" stroke="#dce2d8"/><rect x="875" y="128" width="130" height="30" rx="15" fill="#f8edda" stroke="none"/><text x="887" y="149" font-size="14" fill="#996526" font-weight="600">설계 제안</text><text x="875" y="192" font-size="22" fill="#294632" font-weight="600">04  백테스팅</text><text x="875" y="228" font-size="16" fill="#294632" font-weight="400">설정 요약 전달</text><text x="875" y="257" font-size="16" fill="#294632" font-weight="400">계산 기능은 준비 중</text><text x="875" y="294" font-size="14" fill="#7b887a" font-weight="400">기록 예측 없음</text><rect x="28" y="351" width="1078" height="66" rx="12" fill="#e3edd9" stroke="none"/><text x="49" y="379" font-size="18" fill="#294632" font-weight="600">같은 탭에서 이전·다음·새로고침 → 신체·자세·코스 초안 유지 제안</text><text x="49" y="404" font-size="15" fill="#7b887a" font-weight="400">현재 저장은 sessionStorage입니다. 계정 동기화·탭을 닫은 뒤 복원은 이번 범위 밖입니다.</text></g></svg>