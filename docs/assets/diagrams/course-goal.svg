<rect x="865" y="60" width="210" height="140" rx="14" fill="#ebeaf5"/><text x="885" y="96" font-size="20">도착 위치 일치</text><text x="885" y="136" font-size="16">설정 지도 · 주행 위치도</text><text x="885" y="174" font-size="16">3D 도착선 · 재생 종료</text>
<text x="28" y="236" font-size="14" fill="#6b7968">검증: 부분 바퀴·양방향·설정 복원 / 미검증: 현장 실측 거리·고도·기록 예측</text></g></svg>
