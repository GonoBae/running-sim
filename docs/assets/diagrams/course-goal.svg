<g font-family="Malgun Gothic,sans-serif" fill="#294632">
<text x="28" y="36" font-size="20" font-weight="700">M89 · 구현 흐름 / 거리와 도착을 한 값으로 계산</text>
<rect x="25" y="60" width="215" height="140" rx="14" fill="#e4eddc"/><text x="45" y="93" font-size="20">출발 + 방향</text><text x="45" y="130" font-size="18">바퀴 수 또는 km</text><text x="45" y="174" font-size="15">기존 신체·자세 유지</text>
