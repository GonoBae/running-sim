<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">실행과 재생 상태</title><desc id="desc">화면 설계안 · 계산 상태와 보기 상태를 별도로 관리</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a3ae"/></marker></defs><rect width="1120" height="530" rx="24" fill="#f7f8fa"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="40" y="48" font-size="28" fill="#202b36" text-anchor="start" font-weight="700">실행과 재생 상태</text><text x="40" y="78" font-size="16" fill="#63717d" text-anchor="start" font-weight="500">화면 설계안 · 계산 상태와 보기 상태를 별도로 관리</text><g><rect x="40" y="118" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="132" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="149" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="150" y="182" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">입력 검사</text><text x="150" y="209" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">오류·범위 밖 → 수정</text></g><g><rect x="310" y="118" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="326" y="132" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="369" y="149" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="420" y="182" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">계산 중</text><text x="420" y="209" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">이전 결과와 구분</text></g><g><rect x="580" y="118" width="220" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="596" y="132" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="639" y="149" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="690" y="182" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">준비 완료</text><text x="690" y="209" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">결과 자료 확보</text></g><g><rect x="850" y="118" width="230" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="866" y="132" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="909" y="149" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="965" y="182" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">재생 ↔ 정지</text><text x="965" y="209" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">좌우 함께 제어</text></g><path d="M 260 184 H 302" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 530 184 H 572" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 800 184 H 842" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="40" y="312" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="56" y="326" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="99" y="343" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="190" y="376" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">실패 / 미지원</text><text x="190" y="403" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">이유 표시 · 임의 결과 없음</text></g><g><rect x="410" y="312" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="426" y="326" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="469" y="343" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="560" y="376" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">완료 / 중도 종료</text><text x="560" y="403" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">완주 기록과 진행 거리 구분</text></g><g><rect x="780" y="312" width="300" height="132" rx="18" fill="white" stroke="#d9dfe5"/><rect x="796" y="326" width="86" height="24" rx="12" fill="#eaf0fa"/><text x="839" y="343" font-size="13" fill="#3e5b91" text-anchor="middle" font-weight="500">제안</text><text x="930" y="376" font-size="21" fill="#27313b" text-anchor="middle" font-weight="650">기준 A → 비교 B</text><text x="930" y="403" font-size="16" fill="#63717d" text-anchor="middle" font-weight="500">A 보존 · 자세만 변경</text></g><path d="M 420 250 V 280 H 190 V 304" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 965 250 V 280 H 560 V 304" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 710 378 H 772" fill="none" stroke="#98a3ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>
